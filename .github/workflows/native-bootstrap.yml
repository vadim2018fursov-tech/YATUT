name: YATUT Native Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add native platforms
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync

      - name: Commit native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json ios android capacitor.config.json

          if git diff --cached --quiet; then
            echo "No native bootstrap changes to commit."
            exit 0
          fi

          git commit -m "Bootstrap iOS and Android native apps"
          git push origin HEAD:main
