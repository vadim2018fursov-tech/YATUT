name: YATUT Native Push Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-push-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor native push plugin
        run: npm install @capacitor/push-notifications@8.1.2 --save --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Sync native projects
        run: npx cap sync

      - name: Commit native push dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json ios android

          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi

          git commit -m "Add Capacitor native push notifications"
          git push origin HEAD:main
